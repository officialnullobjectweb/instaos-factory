name: Daily Content Generation

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Start server and generate content
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STORAGE_DRIVER: file
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
        run: |
          npx next build
          npx next start -p 3780 &
          sleep 8

          for brand in studio-noir midnight-ritual daily-grind; do
            echo "Generating for $brand..."
            curl -s -X POST http://localhost:3780/api/ai/generate \
              -H "Content-Type: application/json" \
              -d "{\"brandId\":\"$brand\",\"granular\":false}"
            echo ""
            sleep 60
          done
          echo "Done generating."
