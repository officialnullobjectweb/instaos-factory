name: Weekly Learning Run

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Start server and run learning engine
        env:
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
          STORAGE_DRIVER: file
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          npx next build
          npx next start -p 3780 &
          sleep 8

          echo "Running learning engine..."
          curl -s -X POST http://localhost:3780/api/learning/run \
            -H "Authorization: Bearer $SCHEDULER_SECRET"
          echo ""
          echo "Done."
