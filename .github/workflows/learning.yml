name: Weekly learning

# Runs the self-learning analysis every Sunday, then writes the topic weights
# the generation engine reads on every run. 06:00 UTC on Sunday gives the week
# that just ended time to settle before it is scored.
#
# The analysis is deterministic over the same data, so a retry inside the same
# day cannot drift the weights further.

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

concurrency:
  group: learning
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run weekly analysis
        env:
          SCHEDULER_URL: ${{ secrets.SCHEDULER_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: node scripts/learning-run.mjs
