name: Scheduled Publishing

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Start server and process scheduled posts
        env:
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          STORAGE_DRIVER: file
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          npx next build
          npx next start -p 3780 &
          sleep 8

          echo "Processing scheduled posts..."
          curl -s -X POST http://localhost:3780/api/schedule/process \
            -H "Authorization: Bearer $SCHEDULER_SECRET"
          echo ""
          echo "Done."
