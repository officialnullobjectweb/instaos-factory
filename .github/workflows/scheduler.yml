name: Scheduler

# Publishes due posts and applies the retry policy (3 retries, 15 minutes
# apart). The endpoint is idempotent, so an overlap or a missed run is safe.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Run scheduler tick
        env:
          SCHEDULER_URL: ${{ secrets.SCHEDULER_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: node scripts/scheduler-tick.mjs
